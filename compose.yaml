name: realtime-collaboration-lab

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collaboration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collaboration-local-only}
      POSTGRES_USER: ${POSTGRES_USER:-collaboration}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - collaboration-postgres:/var/lib/postgresql/data

volumes:
  collaboration-postgres:
